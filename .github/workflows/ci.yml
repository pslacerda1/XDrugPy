name: tests

on: ["push", "pull_request"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.12", "3.11"]
        pymol-version: [
          "schrodinger::pymol==3.1.7.2",
          "schrodinger/label/pending::pymol==3.1.8",
          # "conda-forge::pymol-open-source==3.1.0",
        ]
        exclude:
          - os: "macos-latest"
            pymol-version: "schrodinger::pymol==3.1.7.2"
          - os: "ubuntu-latest"
            python-version: "3.11"
    env:
      FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: schrodinger/label/pending, schrodinger, conda-forge, defaults
          activate-environment: test-env
          auto-activate: true

      - name: Setup Rattle Solver
        run: |
          conda install --name base conda-rattler-solver
          conda config --set solver rattler
          conda config --append channels conda-pypi

      - name: Install PyMOL and Conda Dependencies
        run: |
          conda install \
            ${{ matrix.pymol-version }} \
            conda-forge::fontconfig \
            conda-forge::cairo

          if [[ "${{ matrix.pymol-version }}" != *"3.1.8" ]]; then
            conda install conda-forge::catch2==3.13
          fi

      - name: Install XDrugPy
        run: |
          pip install -e .
          python -c '
          from xdrugpy import xdrugpy_install
          xdrugpy_install("${{ github.sha }}")
          '

      - name: Run pytest
        run: |
          pytest -v

      - name: Upload Failed Plots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug-images
          path: |
            tests/data/*_gen.png
            tests/data/*_ref.png
          retention-days: 5