name: tests

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on: ["push", "pull_request"]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.12", "3.11"]
        pymol-version: [
          "schrodinger::pymol==3.1.7.2",
          "schrodinger::pymol==3.1.9",
          "schrodinger/label/pending::pymol==3.1.8",
          # "conda-forge::pymol-open-source==3.1.0",
        ]
        exclude:
          - os: "macos-latest"
            pymol-version: "schrodinger::pymol==3.1.7.2"
          - os: "ubuntu-latest"
            python-version: "3.11"
    env:
      FORCE_COLOR: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
          channels: schrodinger/label/pending, schrodinger, conda-forge, defaults
          activate-environment: test-env
          auto-activate: true
      
      # - name: Setup Rattle Solver
      #   run: |
      #     conda install conda-rattler-solver
      #     conda config --set solver rattler
      #     conda config --append channels conda-pypi
        
      - name: Install PyMOL (and other conda dependencies for tests)
        run: |
          conda install \
            ${{ matrix.pymol-version }} \
            conda-forge::fontconfig \
            conda-forge::cairo

          if [[ "${{ matrix.pymol-version }}" == *"3.1.7.2" ]]
          then
            conda install conda-forge::catch2==3.13
          fi
          if [[ "${{ matrix.pymol-version }}" == *"3.1.8" ]]
          then
            conda install conda-forge::catch2==3.16
          fi
          if [[ "${{ matrix.pymol-version }}" == *"3.1.9" ]]
          then
            conda install conda-forge::catch2==3.16
          fi

          
      - name: Install XDrugPy
        run: |
          pip install -e .
          python -c '
          from xdrugpy import xdrugpy_install
          xdrugpy_install("${{ github.sha }}")
          '
      
      - name: Run pytest
        run: |
          # The order of tests matter
          pytest -vv --maxfail=1 -rf \
            tests/test_docking.py \
            tests/test_hotspots.py \
            tests/test_multi.py

      - name: Upload Failed Plots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug-images
          path: |
            tests/data/*_gen.*
            tests/data/*_ref.*
          retention-days: 5
      
      - name: Conda-Lock
        if: always()
        run: |
          conda list --explicit > conda-lock.txt
          pip freeze > pip-lock.txt
      
      - name: Upload Conda-Lock
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lockfiles
          path: |
            conda-lock.txt
            pip-lock.txt
          retention-days: 5